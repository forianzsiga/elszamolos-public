name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semver gate (strict increment)
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAX=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1 || true)
          vercomp() {
            [ "$1" = "$2" ] && return 1
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$2" ]
          }
          if [ -n "$MAX" ] && ! vercomp "$TAG" "$MAX"; then
            echo "::error::release version v$TAG does not strictly increment v$MAX"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push versioned
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.gate.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

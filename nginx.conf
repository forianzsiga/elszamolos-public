# elszamolos nginx: serve the PWA under /elszamolos/.
# oauth2-proxy fronts this container, so only authenticated requests arrive.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Exact base without trailing slash -> canonical
    location = /elszamolos {
        return 301 /elszamolos/;
    }

    # SPA under the path slug: strip the prefix so the base='/elszamolos/'
    # build resolves assets from the html root; history-router routes fall
    # back to /index.html. The fallback must not point back into this
    # location (that would loop -> 500).
    location /elszamolos/ {
        rewrite ^/elszamolos/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
